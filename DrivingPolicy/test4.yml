stages:
  - fetch
  - verify

checkout_repo:
  stage: fetch
  image: null
  variables:
    GIT_STRATEGY: "none"
    # These are already set in your group; we just reference them
    HTTP_PROXY: ${HTTP_PROXY}
    HTTPS_PROXY: ${HTTPS_PROXY}
    http_proxy: ${HTTP_PROXY}
    https_proxy: ${HTTPS_PROXY}
  before_script:
    # Dynamically set NO_PROXY – no manual input needed
    - export NO_PROXY="localhost,127.0.0.1,.local,${CI_SERVER_HOST},dl-cdn.alpinelinux.org,alpinelinux.org"
    - export no_proxy="$NO_PROXY"
    - echo "Using NO_PROXY=$NO_PROXY"
    # Install packages (Alpine repos are in NO_PROXY, so they bypass proxy)
    - apk add --no-cache curl unzip zip
  script:
    - echo "Downloading repository..."
    - 'curl --header "PRIVATE-TOKEN: $CI_PAT_TOKEN" -L "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/repository/archive.zip?sha=${CI_COMMIT_SHA}" -o repo.zip'
    - unzip repo.zip
    - extracted_dir=$(ls -d */ | head -n1)
    - mv "$extracted_dir" repo
    - ls -la repo
  artifacts:
    paths:
      - repo
    expire_in: 1h

default:
  tags:
    - docker
  image: "codebank.nexus.cloud.frb.org/cicd-executor-ps-az:2"
  before_script:
    - set -euo pipefail

verify_artifact:
  stage: verify
  image: null
  before_script:
    - export NO_PROXY="localhost,127.0.0.1,.local,${CI_SERVER_HOST}"
    - export no_proxy="$NO_PROXY"
  script:
    - ls -la repo/ || (echo "repo missing" && exit 1)
    - echo "Artifact verified"
  needs:
    - job: checkout_repo
      artifacts: true
