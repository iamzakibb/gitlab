stages:
  - build
  - publish
  - package
  - deploy

default:
  tags:
    - restricted-runner
  before_script:
    - set -euo pipefail
    - echo "Runner environment:"
    - echo "Installing dotnet if missing"
    - |
      if ! command -v dotnet >/dev/null 2>&1; then
        curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
        chmod +x dotnet-install.sh
        ./dotnet-install.sh --channel 8.0 --install-dir $HOME/.dotnet
        export PATH=$PATH:$HOME/.dotnet || (
          echo "Fallback installing dotnet via tarball"
          curl -L https://dotnetcli.azureedge.net/dotnet/Sdk/8.0.100/dotnet-sdk-8.0.100-linux-x64.tar.gz -o dotnet.tar.gz
          mkdir -p $HOME/.dotnet
          tar -zxf dotnet.tar.gz -C $HOME/.dotnet
          export PATH=$PATH:$HOME/.dotnet
        )
      fi
    - dotnet --version || true
    - az --version || true
    - zip -v || true

variables:
  DOTNET_CONFIGURATION: "Release"
  PUBLISH_DIR: "publish"
  ZIP_NAME: "app_publish.zip"
  DOTNET_PROJECT_PATH: "src/DrivingPolicy/DrivingPolicy.csproj"
  AZURE_RESOURCE_GROUP: "my-resource-group"
  AZURE_WEBAPP_NAME_DEV: "my-webapp-dev"

build:
  stage: build
  script:
    - echo "Restoring packages"
    - dotnet restore "$DOTNET_PROJECT_PATH"
    - echo "Building project"
    - dotnet build "$DOTNET_PROJECT_PATH" --configuration "$DOTNET_CONFIGURATION" --no-restore
  artifacts:
    expire_in: 1h
    paths:
      - .nuget/packages

publish:
  stage: publish
  needs:
    - build
  script:
    - echo "Publishing project to $PUBLISH_DIR"
    - dotnet publish "$DOTNET_PROJECT_PATH" -c "$DOTNET_CONFIGURATION" -o "$PUBLISH_DIR"
  artifacts:
    paths:
      - $PUBLISH_DIR
    expire_in: 1h

package:
  stage: package
  needs:
    - publish
  script:
    - echo "Packaging $PUBLISH_DIR into $ZIP_NAME"
    - cd "$PUBLISH_DIR"
    - zip -r ../"$ZIP_NAME" .
    - cd ..
    - ls -la "$ZIP_NAME"
  artifacts:
    paths:
      - $ZIP_NAME
    expire_in: 1h

deploy_dev:
  stage: deploy
  needs:
    - package
  environment:
    name: dev
  script:
    - echo "Logging into Azure using service principal"
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - echo "Deploying $ZIP_NAME to $AZURE_WEBAPP_NAME_DEV (resource group -- $AZURE_RESOURCE_GROUP)"
    - az webapp deployment source config-zip --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME_DEV" --src "$ZIP_NAME"
  when: manual
  dependencies:
    - package