stages:
  - fetch
  - build
  - publish
  - package
  - deploy

checkout_repo:
  stage: fetch
  variables:
    GIT_STRATEGY: "none"
  script:
    - echo "Runner used for checkout $CI_RUNNER_DESCRIPTION"
    - echo "Using proxy $HTTP_PROXY / $HTTPS_PROXY"
    - git -c http.proxy="$HTTP_PROXY" -c https.proxy="$HTTPS_PROXY" clone "https://oauth2:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" repo || { echo "manual git clone failed"; exit 1; }
    - ls -la repo
  artifacts:
    name: repo-${CI_COMMIT_SHORT_SHA}
    paths:
      - repo
    expire_in: 1h

default:
  tags:
    - docker
  image: "codebank.nexus.cloud.frb.org/cicd-executor-ps-az:2"
  before_script:
    - set -euo pipefail
    - echo "Runner environment $CI_RUNNER_DESCRIPTION"
    - >
      if ! command -v dotnet >/dev/null 2>&1; then
        echo "dotnet not found - attempting installer";
        curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh || { echo "curl install script failed"; exit 0; }
        chmod +x dotnet-install.sh || true
        ./dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet" || echo "dotnet-install script failed";
        if [ ! -x "$HOME/.dotnet/dotnet" ]; then
          echo "dotnet not present after install script - trying tarball fallback";
          curl -L https://dotnetcli.azureedge.net/dotnet/Sdk/8.0.100/dotnet-sdk-8.0.100-linux-x64.tar.gz -o dotnet.tar.gz || { echo "curl tarball failed"; exit 0; }
          mkdir -p "$HOME/.dotnet"
          tar -zxf dotnet.tar.gz -C "$HOME/.dotnet" || echo "tar extraction failed";
        fi;
        export PATH="$PATH:$HOME/.dotnet";
      else
        echo "dotnet already installed";
      fi
    - export PATH="$PATH:$HOME/.dotnet" || true
    - dotnet --version || true
    - az --version || true
    - zip -v || true

variables:
  DOTNET_CONFIGURATION: "Release"
  PUBLISH_DIR: "publish"
  ZIP_NAME: "app_publish.zip"
  DOTNET_PROJECT_PATH: "src/DrivingPolicy/DrivingPolicy.csproj"
  AZURE_RESOURCE_GROUP: "my-resource-group"
  AZURE_WEBAPP_NAME_DEV: "my-webapp-dev"

build:
  stage: build
  variables:
    GIT_STRATEGY: "none"
  needs:
    - job: checkout_repo
      artifacts: true
  script:
    - echo "Restoring packages"
    - ls -la
    - cd repo
    - dotnet restore "$DOTNET_PROJECT_PATH"
    - echo "Building project"
    - dotnet build "$DOTNET_PROJECT_PATH" --configuration "$DOTNET_CONFIGURATION" --no-restore
  artifacts:
    expire_in: 1h
    paths:
      - repo/.nuget/packages

publish:
  stage: publish
  needs:
    - build
  variables:
    GIT_STRATEGY: "none"
  script:
    - cd repo
    - echo "Publishing project to $PUBLISH_DIR"
    - dotnet publish "$DOTNET_PROJECT_PATH" -c "$DOTNET_CONFIGURATION" -o "../$PUBLISH_DIR"
  artifacts:
    paths:
      - $PUBLISH_DIR
    expire_in: 1h

package:
  stage: package
  needs:
    - publish
  variables:
    GIT_STRATEGY: "none"
  script:
    - echo "Packaging $PUBLISH_DIR into $ZIP_NAME"
    - cd "$PUBLISH_DIR"
    - zip -r "../$ZIP_NAME" .
    - cd ..
    - ls -la "$ZIP_NAME"
  artifacts:
    paths:
      - $ZIP_NAME
    expire_in: 1h

deploy_dev:
  stage: deploy
  needs:
    - package
  variables:
    GIT_STRATEGY: "none"
  environment:
    name: dev
  script:
    - echo "Logging into Azure using service principal"
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - echo "Deploying $ZIP_NAME to $AZURE_WEBAPP_NAME_DEV (resource group -- $AZURE_RESOURCE_GROUP)"
    - az webapp deployment source config-zip --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME_DEV" --src "$ZIP_NAME"
  when: manual
  dependencies:
    - package
