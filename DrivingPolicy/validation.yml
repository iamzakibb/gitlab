stages:
  - validate

validate_azure_access:
  stage: validate
  tags:
    - docker
  image: "codebank.nexus.cloud.frb.org/cicd-executor-ps-az:2"
  variables:
    GIT_STRATEGY: "none"
    APP_HOST: "your-app-name.azurewebsites.net"
    SCM_HOST: "your-app-name.scm.azurewebsites.net"

  script:
    - |
      set -u

      show_tail() {
        file="$1"
        lines="${2:-30}"
        if [ -s "$file" ]; then
          tail -n "$lines" "$file"
        fi
      }

      run_step() {
        name="$1"
        shift
        out_file="$(mktemp)"
        echo "===== $name ====="
        "$@" >"$out_file" 2>&1
        rc=$?
        if [ $rc -ne 0 ]; then
          echo "$name failed (exit $rc)"
          show_tail "$out_file" 40
          rm -f "$out_file"
          exit $rc
        fi
        echo "$name succeeded"
        show_tail "$out_file" 20
        rm -f "$out_file"
      }

      echo "Runner: $CI_RUNNER_DESCRIPTION"
      echo "Server host: $CI_SERVER_HOST"
      echo "Project path: $CI_PROJECT_PATH"
      echo "Proxy env present:"
      env | grep -iE '^(http|https|no)_proxy=' || echo "No proxy vars present"

      run_step "Azure login" az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --only-show-errors -o none
      run_step "Set subscription" az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      echo "Azure account context:"
      az account show --query "{subscription:id,tenantId:tenantId,user:user.name}" -o yaml

      run_step "DNS check APP" nslookup "$APP_HOST"
      run_step "DNS check SCM" nslookup "$SCM_HOST"

      run_step "HTTPS check APP" curl -skvI --max-time 20 "https://$APP_HOST"
      run_step "HTTPS check SCM" curl -skvI --max-time 20 "https://$SCM_HOST"

      echo "Validation stage passed successfully"
