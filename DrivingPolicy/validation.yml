validate_azure_access:
  stage: validate
  tags:
    - docker
  image: "codebank.nexus.cloud.frb.org/cicd-executor-ps-az:2"
  variables:
    GIT_STRATEGY: "none"
    APP_HOST: "your-app-name.azurewebsites.net"
    SCM_HOST: "your-app-name.scm.azurewebsites.net"
  script:
    - |
      set +e
      echo "Runner: $CI_RUNNER_DESCRIPTION"

      echo "Step 1: Azure login"
      AZ_LOGIN_OUT=$(az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none 2>&1)
      AZ_LOGIN_CODE=$?
      if [ $AZ_LOGIN_CODE -ne 0 ]; then
        echo "Azure login failed:"
        echo "$AZ_LOGIN_OUT" | tail -n 20
        exit $AZ_LOGIN_CODE
      fi

      echo "Step 2: Azure account set"
      AZ_SET_OUT=$(az account set --subscription "$AZURE_SUBSCRIPTION_ID" 2>&1)
      AZ_SET_CODE=$?
      if [ $AZ_SET_CODE -ne 0 ]; then
        echo "Azure account set failed:"
        echo "$AZ_SET_OUT" | tail -n 20
        exit $AZ_SET_CODE
      fi

      echo "Step 3: DNS check for app"
      APP_DNS_OUT=$(nslookup "$APP_HOST" 2>&1)
      APP_DNS_CODE=$?
      if [ $APP_DNS_CODE -ne 0 ]; then
        echo "DNS check failed for app host:"
        echo "$APP_DNS_OUT" | tail -n 20
        exit $APP_DNS_CODE
      fi

      echo "Step 4: DNS check for SCM"
      SCM_DNS_OUT=$(nslookup "$SCM_HOST" 2>&1)
      SCM_DNS_CODE=$?
      if [ $SCM_DNS_CODE -ne 0 ]; then
        echo "DNS check failed for SCM host:"
        echo "$SCM_DNS_OUT" | tail -n 20
        exit $SCM_DNS_CODE
      fi

      echo "Step 5: HTTPS check for app"
      APP_CURL_OUT=$(curl -vk --max-time 20 "https://$APP_HOST" 2>&1)
      APP_CURL_CODE=$?
      if [ $APP_CURL_CODE -ne 0 ]; then
        echo "HTTPS check failed for app host:"
        echo "$APP_CURL_OUT" | tail -n 30
        exit $APP_CURL_CODE
      fi

      echo "Step 6: HTTPS check for SCM"
      SCM_CURL_OUT=$(curl -vk --max-time 20 "https://$SCM_HOST" 2>&1)
      SCM_CURL_CODE=$?
      if [ $SCM_CURL_CODE -ne 0 ]; then
        echo "HTTPS check failed for SCM host:"
        echo "$SCM_CURL_OUT" | tail -n 30
        exit $SCM_CURL_CODE
      fi

      echo "Validation stage passed successfully"
