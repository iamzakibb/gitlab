stages:
  - validate

validate_azure_access:
  stage: validate
  tags:
    - docker
  image: "codebank.nexus.cloud.frb.org/cicd-executor-ps-az:2"
  variables:
    GIT_STRATEGY: "none"
    APP_HOST: "your-app-name.azurewebsites.net"
    SCM_HOST: "your-app-name.scm.azurewebsites.net"

  script:
    - set -euo pipefail
    - echo "Runner $CI_RUNNER_DESCRIPTION"

    # ---- Azure Login ----
    - |
      echo "Validating Azure login..."
      OUTPUT=$(az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" 2>&1)
      if [ $? -ne 0 ]; then
        echo "Azure Login Failed:"
        echo "$OUTPUT" | tail -n 5
        exit 1
      fi

    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

    # ---- DNS Check APP ----
    - |
      echo "Checking DNS for APP..."
      OUTPUT=$(nslookup "$APP_HOST" 2>&1)
      if [ $? -ne 0 ]; then
        echo "DNS Failed (APP):"
        echo "$OUTPUT" | tail -n 3
        exit 1
      fi

    # ---- DNS Check SCM ----
    - |
      echo "Checking DNS for SCM..."
      OUTPUT=$(nslookup "$SCM_HOST" 2>&1)
      if [ $? -ne 0 ]; then
        echo "DNS Failed (SCM):"
        echo "$OUTPUT" | tail -n 3
        exit 1
      fi

    # ---- HTTPS Check APP ----
    - |
      echo "Checking HTTPS connectivity (APP)..."
      OUTPUT=$(curl -sk --max-time 15 "https://$APP_HOST" 2>&1)
      if [ $? -ne 0 ]; then
        echo "HTTPS Failed (APP):"
        echo "$OUTPUT" | grep -E "error|fail|reset|refused|timeout" | tail -n 3 || echo "$OUTPUT" | tail -n 3
        exit 1
      fi

    # ---- HTTPS Check SCM ----
    - |
      echo "Checking HTTPS connectivity (SCM)..."
      OUTPUT=$(curl -sk --max-time 15 "https://$SCM_HOST" 2>&1)
      if [ $? -ne 0 ]; then
        echo "HTTPS Failed (SCM):"
        echo "$OUTPUT" | grep -E "error|fail|reset|refused|timeout" | tail -n 3 || echo "$OUTPUT" | tail -n 3
        exit 1
      fi

    - echo "Validation stage passed successfully"
