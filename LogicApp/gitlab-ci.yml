stages:
  - validate
  - fetch
  - deploy

default:
  tags:
    - docker
  image: "codebank.nexus.cloud.frb.org/cicd-executor-ps-az:2"

variables:
  GIT_STRATEGY: "none"

  RESOURCE_GROUP: "mac-n-np-rg-dev-dash"
  LOCATION: "East US"

  # Existing Logic App Standard name
  LOGIC_APP_NAME: "YOUR_LOGIC_APP_NAME"

validate_azure:
  stage: validate

  script:
    - set -euo pipefail

    - echo "========== Azure Validation =========="

    - test -n "$AZURE_CLIENT_ID"
    - test -n "$AZURE_CLIENT_SECRET"
    - test -n "$AZURE_TENANT_ID"
    - test -n "$AZURE_SUBSCRIPTION_ID"

    - |
      az login \
        --service-principal \
        --username "$AZURE_CLIENT_ID" \
        --password "$AZURE_CLIENT_SECRET" \
        --tenant "$AZURE_TENANT_ID" \
        --only-show-errors \
        -o none

    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

    - az account show --output table

fetch_repo:
  stage: fetch

  needs:
    - validate_azure

  script:
    - set -euo pipefail

    - echo "========== Download Repository =========="

    - |
      curl \
        --fail \
        --retry 3 \
        --retry-delay 5 \
        --header "PRIVATE-TOKEN: ${CI_PAT_TOKEN}" \
        --location \
        "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/repository/archive.tar.gz?sha=${CI_COMMIT_SHA}" \
        -o repo.tar.gz

    - mkdir repo

    - tar -xzf repo.tar.gz -C repo --strip-components=1

    - echo "Repository downloaded."

    - ls -R repo | head -100

  artifacts:
    expire_in: 1 hour
    paths:
      - repo

deploy_logic_app:
  stage: deploy

  needs:
    - fetch_repo

  script:
    - set -euo pipefail

    - echo "========== Azure Login =========="

    - |
      az login \
        --service-principal \
        --username "$AZURE_CLIENT_ID" \
        --password "$AZURE_CLIENT_SECRET" \
        --tenant "$AZURE_TENANT_ID" \
        --only-show-errors \
        -o none

    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

    - cd repo

    - echo "========== Locate Logic App Standard Project =========="

    - PROJECT_DIR=$(find . -name host.json -exec dirname {} \; | head -1)

    - |
      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: Could not locate Logic App Standard project (host.json not found)."
        exit 1
      fi

    - 'echo "Project directory: $PROJECT_DIR"'

    - cd "$PROJECT_DIR"

    - test -f host.json

    - echo "========== Packaging Logic App =========="

    - PACKAGE_NAME="logicapp_${CI_COMMIT_SHORT_SHA}_${CI_PIPELINE_IID}.zip"

    - |
      if command -v zip >/dev/null 2>&1; then
        echo "Using native zip..."

        zip -r "../$PACKAGE_NAME" . \
          -x "*.git*" \
          -x ".git/*" \
          -x ".vs/*" \
          -x "bin/*" \
          -x "obj/*"

      else
        echo "zip not found, creating zip using Python"

        PYTHON_BIN="$(command -v python3 || command -v python || true)"

        test -n "$PYTHON_BIN" || PYTHON_BIN=/opt/venv/bin/python

        "$PYTHON_BIN" <<EOF
        import os
        import zipfile

        archive = zipfile.ZipFile("../${PACKAGE_NAME}", "w", zipfile.ZIP_DEFLATED)

        exclude = {".git", ".vs", "bin", "obj"}

        for root, dirs, files in os.walk("."):
            dirs[:] = [d for d in dirs if d not in exclude]

            for file in files:
                full = os.path.join(root, file)
                archive.write(full, os.path.relpath(full, "."))

        archive.close()
        EOF

      fi

    - cd ..

    - test -f "$PACKAGE_NAME"

    - ls -lh "$PACKAGE_NAME"

    - echo "========== Verify Logic App =========="

    - |
      az webapp show \
        --resource-group "$RESOURCE_GROUP" \
        --name "$LOGIC_APP_NAME" \
        --output table

    - echo "========== Deploy Logic App =========="

    - |
      az webapp deploy \
        --resource-group "$RESOURCE_GROUP" \
        --name "$LOGIC_APP_NAME" \
        --src-path "$PACKAGE_NAME" \
        --type zip

    - echo "========== Deployment Complete =========="

    - echo "Logic App workflow deployed successfully."